name: Publish extension

# Builds the extension .zip and a Blender extension repository (index.json),
# then publishes them to GitHub Pages so Blender's "Check for Updates" can see
# new versions. Runs on version tags (e.g. v0.9.1) and on manual dispatch.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer runs supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Blender used to build the package. Bump as needed; must be >= blender_version_min.
  BLENDER_VERSION: "5.0.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          manifest_version=$(grep -E '^version[[:space:]]*=' blender_manifest.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          tag_version="${GITHUB_REF_NAME#v}"
          echo "manifest=$manifest_version tag=$tag_version"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match manifest version '$manifest_version'. Bump 'version' in blender_manifest.toml before tagging."
            exit 1
          fi

      - name: Download Blender
        run: |
          set -euo pipefail
          series="${BLENDER_VERSION%.*}"
          url="https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "Downloading $url"
          # Download/extract OUTSIDE the checkout so the tarball is never seen by
          # `extension build --source-dir .` and bundled into the package.
          curl -fsSL "$url" -o "${RUNNER_TEMP}/blender.tar.xz"
          mkdir -p "$HOME/blender"
          tar -xf "${RUNNER_TEMP}/blender.tar.xz" -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"

      - name: Build extension and generate repository
        run: |
          set -euo pipefail
          repo_dir="${RUNNER_TEMP}/repo"
          mkdir -p "$repo_dir"
          # Build into a dir outside the checkout so it is never scanned as source.
          blender --command extension build --source-dir . --output-dir "$repo_dir"
          # Generate index.json (and a browsable index.html) from the zip(s).
          blender --command extension server-generate --repo-dir "$repo_dir" --html
          echo "Repository contents:"
          ls -l "$repo_dir"
          mkdir -p site
          cp -r "$repo_dir"/. site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
